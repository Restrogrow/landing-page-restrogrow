<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Choose Your Demo Slot | RestroGrow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--o:#FC5301;--o2:#E54A00;--ink:#00000C;--cream:#FBF6F1;--tx:#1A1A26;--mu:#5E5E70;--ln:#ECE6DF}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;grid-template-columns:minmax(0,1fr);place-items:center;padding:24px 16px;font:400 16px/1.6 'Poppins',system-ui,sans-serif;color:var(--tx);background:var(--cream)}
.card{width:100%;min-width:0;max-width:560px;background:#fff;border:1px solid var(--ln);border-radius:24px;padding:clamp(24px,5vw,40px);box-shadow:0 20px 60px rgba(0,0,12,.08)}
h1{font:800 clamp(1.5rem,5vw,1.9rem)/1.25 'Montserrat',system-ui,sans-serif;margin:0 0 6px}
p{margin:0 0 14px;color:var(--mu)}
.days{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin:18px 0 14px}
.d{flex:0 0 auto;padding:10px 16px;border:1.5px solid var(--ln);border-radius:12px;background:#fff;font:600 .92rem 'Poppins',sans-serif;color:var(--tx);cursor:pointer}
.d.on{border-color:var(--o);background:#FFF1EA;color:var(--o2)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px;max-height:300px;overflow-y:auto;padding:2px}
.s{padding:11px 4px;border:1.5px solid var(--ln);border-radius:10px;background:#fff;font:500 .92rem 'Poppins',sans-serif;color:var(--tx);cursor:pointer}
.s:hover{border-color:var(--o)}
.s.on{background:var(--o);border-color:var(--o);color:#fff}
.go{width:100%;height:54px;margin-top:20px;border:0;border-radius:14px;background:var(--o);color:#fff;font:700 1rem 'Montserrat',sans-serif;cursor:pointer}
.go:disabled{background:#d8d0c8;cursor:not-allowed}
.go:not(:disabled):hover{background:var(--o2)}
.err{color:#B3261E;font-size:.9rem;margin:12px 0 0;min-height:1.2em}
.ok{text-align:center}
.ok .big{font:800 1.3rem 'Montserrat',sans-serif;color:var(--o);margin:6px 0 4px}
.join{display:inline-flex;align-items:center;justify-content:center;height:54px;padding:0 28px;border-radius:14px;background:#1A73E8;color:#fff;font:600 1rem 'Poppins',sans-serif;text-decoration:none;margin-top:8px}
.note{font-size:.85rem;color:var(--mu);margin-top:14px}
</style>
</head>
<body>
<main class="card" id="c"><p>Loading your slots...</p></main>
<script>
(function(){
  var C=document.getElementById("c"),eid=new URLSearchParams(location.search).get("e")||"",sel=0,days=[],day=0;
  function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
  function booked(label,link){
    C.innerHTML='<div class="ok"><h1>Your demo is booked</h1><div class="big">'+esc(label)+'</div><p>We have sent the meeting link on WhatsApp too.</p>'+
      (link?'<a class="join" href="'+esc(link)+'" target="_blank" rel="noopener">Open Google Meet link</a>':'')+
      '<p class="note">Please join a minute early. If you need another time, just reply on WhatsApp.</p></div>';
  }
  function fail(m){C.innerHTML='<h1>Choose your demo slot</h1><p>'+esc(m)+'</p>'}
  function draw(name,mins){
    var h='<h1>'+(name?'Hi '+esc(name)+', ':'')+'choose your demo slot</h1><p>Pick a time that suits you. The demo takes about '+mins+' minutes on Google Meet. Times are in IST.</p><div class="days" id="dd">';
    days.forEach(function(d,i){h+='<button type="button" class="d'+(i===day?' on':'')+'" data-i="'+i+'">'+esc(d.day)+'</button>'});
    h+='</div><div class="grid" id="gg">';
    days[day].slots.forEach(function(s){h+='<button type="button" class="s'+(s.ts===sel?' on':'')+'" data-t="'+s.ts+'">'+esc(s.label)+'</button>'});
    h+='</div><button type="button" class="go" id="go"'+(sel?'':' disabled')+'>Confirm my slot</button><div class="err" id="er"></div>';
    C.innerHTML=h;
    document.getElementById("dd").onclick=function(e){var b=e.target.closest(".d");if(!b)return;day=+b.dataset.i;sel=0;draw(name,mins)};
    document.getElementById("gg").onclick=function(e){var b=e.target.closest(".s");if(!b)return;sel=+b.dataset.t;draw(name,mins)};
    document.getElementById("go").onclick=function(){
      var g=this,er=document.getElementById("er");g.disabled=true;g.textContent="Booking...";er.textContent="";
      fetch("api/book.php",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({e:eid,ts:sel})})
        .then(function(r){return r.json().catch(function(){return {}}).then(function(j){if(!r.ok)throw new Error(j.error||"Could not book. Please try again.");return j})})
        .then(function(j){booked(j.label,j.link)})
        .catch(function(x){g.disabled=false;g.textContent="Confirm my slot";er.textContent=x.message;if(/taken/i.test(x.message))load()});
    };
  }
  function load(){
    if(!eid)return fail("This link is not valid.");
    fetch("api/slots.php?e="+encodeURIComponent(eid)).then(function(r){return r.json().catch(function(){return {}}).then(function(j){if(!r.ok)throw new Error(j.error||"Could not load slots.");return j})})
      .then(function(j){
        if(j.booked)return booked(j.booked.label,j.booked.link);
        days=j.days||[];sel=0;day=0;
        if(!days.length)return fail("No free slots are open right now. Please reply on WhatsApp and we will fix a time with you.");
        draw(j.name,j.minutes);
      }).catch(function(x){fail(x.message)});
  }
  load();
})();
</script>
</body>
</html>
