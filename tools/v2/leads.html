<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>V2 Leads - RestroGrow Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<script>try{if(sessionStorage.getItem("rgAdminPw"))document.documentElement.className="pw"}catch(e){}</script>
<link rel="stylesheet" href="admin.css?v=20261021a">
<style>
/* Version 2 leads page: one toolbar, filters tucked away, calm cards. */
.lh{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between;margin-bottom:14px}
.lh #q{flex:1 1 260px;max-width:420px;height:44px}
.stats{display:flex;flex-wrap:wrap;gap:6px 14px;color:var(--mu);font-size:.85rem;margin-top:4px}
.stats b{color:var(--tx);font-weight:600}
.chips{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;flex:1 1 auto;min-width:0}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none}
.tb{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.tb .sp{flex:1}
.fbtn{height:38px;padding:0 14px;border-radius:10px;border:1.5px solid var(--ln);background:var(--card);font-weight:600;font-size:.85rem;cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.fbtn svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
.fbtn i{font-style:normal;background:var(--o);color:#fff;border-radius:99px;padding:0 7px;font-size:.72rem;line-height:1.6}
.fbtn[aria-expanded=true]{border-color:var(--o);color:var(--o)}
.srt{height:38px;font-size:.85rem;padding:0 10px;border-radius:10px}
.drw{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:14px 16px;margin-bottom:12px}
.drw[hidden]{display:none}
.drw .fg{margin-top:0}
.drw .more{margin-top:12px}
.drw .more>summary{cursor:pointer;font-size:.82rem;font-weight:600;color:var(--mu)}
.drw .more .fg{margin-top:10px}
.drw .fa{justify-content:space-between}
.drw .fa .tools{display:flex;gap:8px;flex-wrap:wrap}
.fx{margin:0 0 12px}
.fchip{background:#FFEDE3}
/* card */
.leads{grid-template-columns:repeat(auto-fill,minmax(min(360px,100%),1fr))}
.lead{gap:14px;padding:16px 16px 12px}
.lead .hd{align-items:flex-start;gap:12px}
.lead .hd select.st{width:auto;max-width:150px;height:34px;font-size:.8rem;padding:0 8px;flex:none}
.lead .av{width:40px;height:40px;font-size:1rem}
.dm{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;font-size:.86rem;background:var(--track)}
.dm svg{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.dm .tx{flex:1;min-width:0;line-height:1.35}
.dm .tx small{display:block;font-size:.74rem;opacity:.85;overflow-wrap:anywhere}
.dm.ok{background:#DCFCE7;color:#14532D}
.dm.bad{background:#FEE2E2;color:#7F1D1D}
.dm.none{color:var(--mu)}
.dm .join{flex:none;height:32px;padding:0 12px;border-radius:8px;background:#15803D;color:#fff;font-weight:600;font-size:.8rem;text-decoration:none;display:inline-flex;align-items:center}
.ct{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:.88rem}
.ct a{color:inherit;text-decoration:none;overflow-wrap:anywhere}
.ct a:hover{color:var(--o)}
.ct .p{font-weight:600}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px 12px;margin:0}
.kv div{min-width:0}
.kv dt{font-size:.7rem;color:var(--mu)}
.kv dd{margin:0;font-size:.84rem;font-weight:500;overflow-wrap:anywhere}
.ft{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;padding-top:10px;border-top:1px solid var(--ln);font-size:.76rem;color:var(--mu)}
.ft .dot{width:6px;height:6px;border-radius:50%;background:#9CA3AF;display:inline-block;margin-right:4px}
.ft .dot.ok{background:#22C55E}.ft .dot.bad{background:#EF4444}
.ft .sp{flex:1}
.ft details{width:100%}
.ft summary{cursor:pointer;font-weight:500}
.ft pre{margin:8px 0 0;padding:8px 10px;border-radius:10px;background:var(--track);white-space:pre-wrap;word-break:break-all;font:500 .7rem/1.55 ui-monospace,Consolas,monospace;color:var(--tx)}
.ft .del{padding:0;font-size:.76rem}
.adl{color:var(--tx)}
@media (max-width:760px){.lh #q{max-width:none}.tb .srt{flex:1}}
</style>
</head>
<body>
<div id="login"><form id="lf">
  <h1>Admin login</h1><p>Enter the password to continue.</p>
  <input id="pw" type="password" placeholder="Password" autocomplete="current-password" required autofocus>
  <button class="btn" type="submit">Log in</button>
  <div id="err" role="alert"></div>
</form></div>

<div id="app">
  <nav class="nav">
    <span class="logo">Restro<b>Grow</b></span>
    <a class="tab" href="index.html">Dashboard</a>
    <a class="tab on" href="leads.html">Leads</a>
    <span class="sp"></span>
    <button class="btn ghost" id="ref" type="button">Refresh</button>
    <button class="btn ghost" id="csv" type="button">Download CSV</button>
    <button class="btn ghost" id="out" type="button">Log out</button>
  </nav>

  <div class="lh">
    <div><h1>Leads</h1><div class="stats" id="cnt"></div></div>
    <input id="q" type="search" placeholder="Search name, phone, email, brand, city, notes">
  </div>

  <div id="waBar" class="x-warn" hidden></div>

  <div class="tb">
    <button type="button" class="fbtn" id="fbtn" aria-expanded="false" aria-controls="drw"><svg viewBox="0 0 24 24"><path d="M4 6h16M7 12h10M10 18h4"/></svg>Filters<i id="fpn" hidden></i></button>
    <select class="srt" id="srt" aria-label="Sort"><option value="new">Newest first</option><option value="demo">Upcoming demos first</option><option value="fu">Follow-ups due first</option><option value="old">Oldest first</option></select>
    <div class="chips" id="chips"></div>
  </div>

  <div class="drw" id="drw" hidden>
    <div class="fg" id="fg"></div>
    <details class="more"><summary>More filters (ads, page, city, size)</summary><div class="fg" id="fg2"></div></details>
    <div class="fa">
      <label class="gb">Group by
        <select id="gb"><option value="">No grouping</option><option value="slot">Demo slot</option><option value="business">Business type</option><option value="src">Source</option><option value="camp">Campaign</option><option value="page">Landing page</option><option value="budget">Budget</option><option value="city">City</option></select>
      </label>
      <div class="tools"><span id="demoBtns" class="tools"></span><button type="button" class="btn ghost" id="fclr">Clear all</button></div>
    </div>
  </div>
  <div class="fx" id="fx"></div>

  <div class="leads" id="tb"></div>
</div>

<script src="common.js?v=20261021a"></script>
<script src="lead-panel.js?v=20261021a"></script>
<script>
(function(){
  var $=RG.$,esc=RG.esc,leads=[],filter="",shown=[],groupBy="",sortBy="new";
  var COLS=["time","name","phone","email","business","brand","location","outlets","orders","turnover","budget","status","notes","slot_start","meet_link","utm_source","utm_medium","utm_campaign","utm_content","utm_term","gclid","fbclid","page","ad_params","referrer","landing","last_call","calls","follow_up"];

  /* ---------- what each lead tells us about the ad ---------- */
  function adInfo(l){
    var p={};try{p=JSON.parse(l.ad_params||"{}")||{}}catch(x){}
    var pk=function(){for(var i=0;i<arguments.length;i++)if(p[arguments[i]])return p[arguments[i]];return ""};
    var f={camp:pk("utm_campaign","campaign_name","campaign","campaignid","campaign_id"),adset:pk("adset_name","adset","adgroup","adgroupid","adset_id","utm_content"),ad:pk("ad_name","ad","creative","ad_id"),place:pk("placement","site_source_name","network"),kw:pk("utm_term","keyword")};
    var parts=[["Campaign",f.camp],["Ad set",f.adset],["Ad",f.ad],["Placement",f.place],["Keyword",f.kw]].filter(function(x){return x[1]});
    var all=Object.keys(p);
    return {f:f,parts:parts,all:all.length?all.map(function(k){return k+" = "+p[k]}).join("\n"):"",ref:l.referrer||""};
  }
  function srcOf(l){
    var u=String(l.utm_source||"").toLowerCase();
    if(/facebook|meta|instagram|^fb$/.test(u))return "Meta";
    if(/youtube/.test(u))return "YouTube";
    if(/google/.test(u))return "Google";
    if(l.fbclid)return "Meta";
    if(l.gclid)return "Google";
    return u?u.charAt(0).toUpperCase()+u.slice(1):"Direct / other";
  }
  function pageOf(l){return (String(l.page||"").match(/\/lp\/([a-z0-9-]+)/)||[])[1]||"main page"}
  function slotOf(l){
    if(l.is_demo)return "Demo data";
    if(!l.slot_start)return l.meet_note&&!l.meet_link?"Booking failed":"Not booked";
    return new Date(l.slot_start)<new Date()?"Demo done (past)":"Booked (upcoming)";
  }
  // One flat record per lead, used by filters and grouping.
  function fx(l){
    var a=adInfo(l),d=new Date(l.time),cl=function(v){return v||"(none)"};
    return {src:srcOf(l),camp:cl(a.f.camp),adset:cl(a.f.adset),ad:cl(a.f.ad),page:pageOf(l),status:l.status,budget:cl(l.budget),turnover:cl(l.turnover),orders:cl(l.orders),outlets:cl(l.outlets),
      business:cl(l.business),slot:slotOf(l),fu:RG.followState(l),calls:RG.callState(l),
      city:cl(String(l.location||"").split(",").pop().trim()),wa:l.wa_status==="sent"||l.wa_status==="demo"?"Sent":l.wa_status?"Failed":"Not recorded",data:l.is_demo?"Demo only":"Real only",
      days:isNaN(d)?9999:(Date.now()-d)/864e5};
  }

  /* ---------- filters: the everyday ones on top, the ad ones under "More" ---------- */
  var F={};
  var MAIN=[["date","Date",["Today","Last 7 days","Last 30 days"]],["fu","Follow-up",["Overdue","Today","Upcoming","Not set"]],["calls","Calls",["Not called yet","Called today","Called earlier","Called (time not recorded)"]],["slot","Demo slot"],["business","Business type"],["budget","Budget"],["src","Source"],["wa","WhatsApp"]];
  var MORE=[["camp","Campaign"],["adset","Ad set / group"],["ad","Ad"],["page","Landing page"],["turnover","Turnover"],["orders","Orders / day"],["outlets","Outlets"],["city","City"],["data","Data",["Real only","Demo only"]]];
  var DEFS=MAIN.concat(MORE);
  function passes(l,f,skip){
    return DEFS.every(function(d){
      var k=d[0];if(k===skip||!F[k])return true;
      if(k==="date"){var n=F.date==="Today"?1:F.date==="Last 7 days"?7:30;return f.days<=n}
      return f[k]===F[k];
    });
  }
  function selects(defs,recs){
    return defs.map(function(d){
      var k=d[0],opts;
      if(d[2])opts=d[2].map(function(v){return [v,0]});
      else{var m={};recs.forEach(function(r,i){if(passes(leads[i],r,k))m[r[k]]=(m[r[k]]||0)+1});opts=Object.keys(m).sort(function(a,b){return m[b]-m[a]}).map(function(v){return [v,m[v]]})}
      if(F[k]&&!opts.some(function(o){return o[0]===F[k]}))opts.unshift([F[k],0]);
      return '<label class="fl"><span>'+d[1]+'</span><select data-k="'+k+'"><option value="">All</option>'+opts.map(function(o){return '<option value="'+esc(o[0])+'"'+(F[k]===o[0]?" selected":"")+">"+esc(o[0])+(d[2]?"":" ("+o[1]+")")+"</option>"}).join("")+"</select></label>";
    }).join("");
  }
  function buildFilters(){
    var recs=leads.map(function(l){return fx(l)});
    $("fg").innerHTML=selects(MAIN,recs);$("fg2").innerHTML=selects(MORE,recs);
    var act=DEFS.filter(function(d){return F[d[0]]});
    $("fpn").hidden=!act.length;$("fpn").textContent=act.length;
    $("fx").innerHTML=act.map(function(d){return '<button type="button" class="fchip" data-k="'+d[0]+'">'+d[1]+": "+esc(F[d[0]])+" ×</button>"}).join("");
  }
  $("drw").addEventListener("change",function(e){var s=e.target.closest("select[data-k]");if(!s)return;F[s.getAttribute("data-k")]=s.value;redraw()});
  $("fx").addEventListener("click",function(e){var b=e.target.closest(".fchip");if(!b)return;F[b.getAttribute("data-k")]="";redraw()});
  $("fclr").addEventListener("click",function(){F={};filter="";$("q").value="";groupBy="";$("gb").value="";redraw()});
  $("gb").addEventListener("change",function(){groupBy=this.value;list()});
  $("srt").addEventListener("change",function(){sortBy=this.value;list()});
  $("fbtn").addEventListener("click",function(){var o=$("drw").hidden;$("drw").hidden=!o;this.setAttribute("aria-expanded",String(o))});
  function redraw(){buildFilters();chips();list()}

  try{var p0=new URLSearchParams(location.search).get("status");if(p0&&RG.STATUSES.indexOf(p0)>-1)filter=p0}catch(x){}

  function chips(){
    $("chips").innerHTML=['<button type="button" class="chip'+(filter?"":" on")+'" data-f="">All<b>'+leads.length+"</b></button>"].concat(RG.STATUSES.map(function(s){
      var m=leads.filter(function(l){return l.status===s}).length;
      return '<button type="button" class="chip'+(filter===s?" on":"")+'" data-f="'+esc(s)+'">'+esc(s)+"<b>"+m+"</b></button>";
    })).join("");
  }

  var IC='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.6 10.8a15 15 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25 11.4 11.4 0 0 0 3.6.57 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.57a1 1 0 0 1-.25 1z"/></svg>';
  var CAL='<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/></svg>';
  function demoBox(l){
    if(l.is_demo)return "";
    if(l.meet_link){
      var past=l.slot_start&&new Date(l.slot_start)<new Date();
      return '<div class="dm ok">'+CAL+'<div class="tx"><b>'+(past?"Demo was ":"Demo ")+esc(l.slot_start?RG.fmt(l.slot_start):"booked")+'</b><small>'+esc(l.meet_link.replace("https://",""))+'</small></div><a class="join" href="'+esc(l.meet_link)+'" target="_blank" rel="noopener">Join</a></div>';
    }
    if(l.meet_note)return '<div class="dm bad">'+CAL+'<div class="tx"><b>Demo booking failed</b><small>'+esc(l.meet_note)+'</small></div></div>';
    return '<div class="dm none">'+CAL+'<div class="tx">Demo slot not chosen yet</div></div>';
  }
  function waLink(l){return "https://wa.me/91"+encodeURIComponent(l.phone)+"?text="+encodeURIComponent("Hi "+l.name+", this is RestroGrow. Thanks for requesting a demo.")}
  function card(l){
    var opts=RG.STATUSES.map(function(x){return "<option"+(x===l.status?" selected":"")+">"+esc(x)+"</option>"}).join("");
    var wa=waLink(l);
    var kv=[["Business",l.business],["Outlets",l.outlets],["Orders / day",l.orders],["Turnover",l.turnover],["Budget",l.budget]].filter(function(x){return x[1]})
      .map(function(x){return '<div><dt>'+x[0]+'</dt><dd>'+esc(x[1])+'</dd></div>'}).join("");
    var ai=adInfo(l),waOk=l.wa_status==="sent"||l.wa_status==="demo";
    var waTxt=l.is_demo?"demo, nothing sent":l.wa_status?(waOk?"WhatsApp sent":"WhatsApp failed"):"WhatsApp not recorded";
    var adTxt=(ai.parts.length?ai.parts.map(function(x){return x[0]+": "+x[1]}).join("\n")+"\n":"")+(ai.all?"\n"+ai.all+"\n":"")+(ai.ref?"referrer = "+ai.ref+"\n":"")+(l.landing?"landing = "+l.landing:"")+(!waOk&&l.wa_note?"\nWhatsApp note: "+l.wa_note:"");
    var rs=(!l.is_demo&&l.wa_status&&!waOk)?'<button type="button" class="rs">Resend WhatsApp message</button>':"";
    return '<article class="lead" data-id="'+l.id+'" data-s="'+esc(l.status)+'">'
      +'<div class="hd"><div class="av">'+esc((l.name||"?").trim().charAt(0).toUpperCase())+'</div><div class="hi"><div class="nm">'+esc(l.name)+(l.is_demo?' <span class="demo">DEMO</span>':"")+'</div><div class="mt">'+esc(l.brand)+' · '+esc(l.location)+'</div><div class="mt">'+esc(RG.fmt(l.time))+'</div></div>'
      +'<select class="st" data-s="'+esc(l.status)+'" aria-label="Status">'+opts+'</select></div>'
      +demoBox(l)
      +'<div class="ct"><a class="p" href="tel:+91'+encodeURIComponent(l.phone)+'">+91 '+esc(l.phone)+'</a>'+(l.email?'<a href="mailto:'+esc(l.email)+'">'+esc(l.email)+'</a>':"")+'</div>'
      +(kv?'<dl class="kv">'+kv+'</dl>':"")
      +RG.actLine(l)
      +'<div class="acts three"><a class="cl" href="tel:+91'+encodeURIComponent(l.phone)+'">'+IC+'Call</a><a class="wa" href="'+wa+'" target="_blank" rel="noopener">WhatsApp</a><button type="button" class="op">Open</button></div>'
      +'<textarea class="nt" maxlength="2000" placeholder="Add note" aria-label="Notes">'+esc(l.notes)+'</textarea>'+rs
      +'<div class="ft"><span>'+esc(srcOf(l))+' · '+esc(pageOf(l))+'</span><span><i class="dot '+(l.is_demo?"":waOk?"ok":l.wa_status?"bad":"")+'"></i>'+esc(waTxt)+'</span><span class="sp"></span><button type="button" class="del">Delete</button>'
      +(adTxt.trim()?'<details><summary>Ad and tracking details</summary><pre>'+esc(adTxt.trim())+'</pre></details>':"")+'</div></article>';
  }
  function sorted(a){
    var t=function(l){return new Date(l.time).getTime()||0},now=Date.now();
    if(sortBy==="old")return a.slice().sort(function(x,y){return t(x)-t(y)});
    if(sortBy==="fu")return a.slice().sort(function(x,y){
      var f=function(l){var d=RG.followState(l)==="Not set"?null:RG.followUp(l);return d?d.getTime():Infinity};   /* soonest (and overdue) follow-up on top */
      return f(x)-f(y)||t(y)-t(x);
    });
    if(sortBy==="demo")return a.slice().sort(function(x,y){
      var sx=x.slot_start?new Date(x.slot_start).getTime():0,sy=y.slot_start?new Date(y.slot_start).getTime():0;
      var ux=sx>=now?0:1,uy=sy>=now?0:1;   /* upcoming demos first (soonest on top), then everyone else newest first */
      return ux!==uy?ux-uy:(ux===0?sx-sy:t(y)-t(x));
    });
    return a.slice().sort(function(x,y){return t(y)-t(x)});
  }
  function stats(){
    var now=Date.now(),real=leads.filter(function(l){return !l.is_demo});
    var up=real.filter(function(l){return l.slot_start&&new Date(l.slot_start).getTime()>=now}).length;
    var today=real.filter(function(l){return (now-new Date(l.time))/864e5<=1}).length;
    var nw=real.filter(function(l){return l.status==="New"}).length;
    var due=real.filter(function(l){var s=RG.followState(l);return s==="Overdue"||s==="Today"}).length;
    $("cnt").innerHTML='<span>Showing <b>'+shown.length+'</b> of '+leads.length+'</span><span><b>'+today+'</b> today</span><span><b>'+nw+'</b> not called yet</span><span><b>'+up+'</b> upcoming demo'+(up===1?"":"s")+'</span>'+(due?'<span><b>'+due+'</b> follow-up'+(due===1?"":"s")+' due</span>':"");
  }
  function list(){
    var q=$("q").value.trim().toLowerCase();
    shown=sorted(leads.filter(function(l){
      RG.derive(l);
      if(filter&&l.status!==filter)return false;
      if(!passes(l,fx(l)))return false;
      if(!q)return true;
      var ai=adInfo(l);
      return COLS.some(function(k){return String(l[k]||"").toLowerCase().indexOf(q)>-1})||(ai.f.camp+" "+ai.f.adset+" "+ai.f.ad).toLowerCase().indexOf(q)>-1;
    }));
    stats();
    if(!shown.length){$("tb").innerHTML='<div class="empty card" style="grid-column:1/-1">No leads match. <button type="button" class="btn ghost" id="fclr2" style="margin-left:8px">Clear filters</button></div>';return}
    if(!groupBy){$("tb").innerHTML=shown.map(card).join("");return}
    var g={},order=[];shown.forEach(function(l){var v=fx(l)[groupBy];if(!g[v]){g[v]=[];order.push(v)}g[v].push(l)});
    order.sort(function(a,b){return g[b].length-g[a].length});
    var label=$("gb").options[$("gb").selectedIndex].text;
    $("tb").innerHTML=order.map(function(v){return '<h3 class="gh">'+esc(label)+': '+esc(v)+' <b>'+g[v].length+'</b></h3>'+g[v].map(card).join("")}).join("");
  }
  $("tb").addEventListener("click",function(e){if(e.target.id==="fclr2")$("fclr").click()});

  // Demo data: 10 clearly marked fake leads to try the filters and charts. They send nothing and can be removed in one click.
  function demoBar(){
    var has=leads.some(function(l){return l.is_demo});
    $("demoBtns").innerHTML='<button type="button" class="btn ghost" id="demoAdd">'+(has?"Reset 10 demo leads":"Add 10 demo leads")+'</button>'+(has?'<button type="button" class="btn ghost" id="demoDel">Remove demo leads</button>':"");
  }
  $("demoBtns").addEventListener("click",function(e){
    var b=e.target.closest("button");if(!b)return;
    var add=b.id==="demoAdd";
    if(add&&!confirm("Add 10 fake DEMO leads to your database? No WhatsApp messages are sent. You can remove them any time with one click."))return;
    if(!add&&!confirm("Remove all demo leads? Your real leads are not touched."))return;
    b.disabled=true;
    fetch("../api/demo_leads.php",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({password:RG.pw,action:add?"add":"remove"})})
      .then(function(r){return r.json().then(function(j){if(!r.ok)throw new Error(j.error||"Error")})})
      .then(function(){return RG.refresh()})
      .catch(function(x){alert("Failed: "+x.message);b.disabled=false});
  });

  // Banner: leads whose WhatsApp confirmation did not go out, with a one-click resend.
  function waBar(){
    var bad=leads.filter(function(l){return !l.is_demo&&l.wa_status&&l.wa_status!=="sent"}).length,b=$("waBar");
    if(!bad){b.hidden=true;return}
    b.hidden=false;b.innerHTML='<span><b>'+bad+' lead'+(bad>1?'s':'')+'</b> did not get the WhatsApp message.</span><button type="button" class="btn" id="waAll">Resend to all</button>';
  }
  function resend(body,btn){
    if(btn){btn.disabled=true;btn.textContent="Sending..."}
    body.password=RG.pw;
    return fetch("../api/lead_resend.php",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)})
      .then(function(r){return r.json().then(function(j){if(!r.ok)throw new Error(j.error||"Error");return j})})
      .then(function(j){j.results.forEach(function(x){leads.forEach(function(l){if(l.id===x.id){l.wa_status=x.status;l.wa_note=x.note}})});chips();list();waBar();
        var f=j.results.filter(function(x){return x.status!=="sent"}).length;if(f)alert(f+" message(s) still failed. Open 'Ad and tracking details' on the lead to see why.")})
      .catch(function(x){alert("Not sent: "+x.message);if(btn){btn.disabled=false;btn.textContent="Resend"}});
  }
  $("waBar").addEventListener("click",function(e){if(e.target.id==="waAll")resend({all:true},e.target)});
  function render(){leads=RG.leads;buildFilters();chips();list();waBar();demoBar()}

  function save(cardEl){
    var l=leads.filter(function(x){return String(x.id)===cardEl.getAttribute("data-id")})[0];if(!l)return;
    var st=cardEl.querySelector("select.st").value,nt=cardEl.querySelector("textarea").value;
    if(st===l.status&&nt===l.notes)return;
    // the card stays where it is (no list redraw), so changing the status never makes it vanish
    RG.saveLead(l,st,nt)
      .then(function(){cardEl.querySelector("select.st").setAttribute("data-s",l.status);cardEl.setAttribute("data-s",l.status);var a=cardEl.querySelector(".act");if(a)a.outerHTML=RG.actLine(l);RG.derive(l);chips();stats()})
      .catch(function(x){alert("Not saved: "+x.message)});
  }
  // After a change, redraw just that card where it is: it stays on screen even if it no longer matches the filter,
  // until the filter, search, sort or Refresh is used.
  function touch(l){
    var c=document.querySelector('.lead[data-id="'+l.id+'"]');
    if(c){var d=document.createElement("div");d.innerHTML=card(l);c.parentNode.replaceChild(d.firstChild,c)}
    RG.derive(l);chips();stats();
  }
  function byId(id){return leads.filter(function(x){return x.id===+id})[0]}
  RG.panel({get:byId,list:function(){return shown.map(function(l){return l.id})},changed:touch,wa:waLink,
    extra:function(l){return demoBox(l)+'<div class="sch"><span class="tag">Source: '+esc(srcOf(l))+'</span><span class="tag">Page: '+esc(pageOf(l))+'</span></div>'}});

  $("q").addEventListener("input",list);
  $("chips").addEventListener("click",function(e){var b=e.target.closest("[data-f]");if(!b)return;filter=b.getAttribute("data-f");chips();list()});
  $("tb").addEventListener("change",function(e){if(e.target.matches("select.st"))save(e.target.closest(".lead"))});
  $("tb").addEventListener("click",function(e){var b=e.target.closest(".rs");if(b)resend({id:+b.closest(".lead").getAttribute("data-id")},b)});
  // Permanently deletes a lead (use for test leads). Its phone number can then be submitted again.
  $("tb").addEventListener("click",function(e){
    var b=e.target.closest(".del");if(!b)return;
    var cardEl=b.closest(".lead"),id=+cardEl.getAttribute("data-id"),l=leads.filter(function(x){return x.id===id})[0];if(!l)return;
    if(!confirm("Delete "+l.name+" ("+l.phone+") permanently? This cannot be undone."))return;
    fetch("../api/lead_delete.php",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({password:RG.pw,id:id})})
      .then(function(r){return r.json().then(function(j){if(!r.ok)throw new Error(j.error||"Error")})})
      .then(function(){leads=leads.filter(function(x){return x.id!==id});RG.leads=leads;buildFilters();chips();list();demoBar()})
      .catch(function(x){alert("Not deleted: "+x.message)});
  });
  $("tb").addEventListener("focusout",function(e){if(e.target.tagName==="TEXTAREA")save(e.target.closest(".lead"))});
  // Tapping Call (button or number) saves the call time, marks the lead as Called (if it was New / Not answered / Follow-up)
  // and opens the lead, so after the call you just tap how it went.
  $("tb").addEventListener("click",function(e){
    var a=e.target.closest(".cl,.ct .p");if(!a)return;
    var l=byId(a.closest(".lead").getAttribute("data-id"));if(!l)return;
    RG.markCalled(l).then(function(){touch(l);RG.panelRedraw()}).catch(function(x){alert("Call time not saved: "+x.message)});
    setTimeout(function(){RG.openLead(l.id,true)},0);
  });
  $("tb").addEventListener("click",function(e){
    var a=e.target.closest(".wa");if(!a)return;
    var l=byId(a.closest(".lead").getAttribute("data-id"));if(l)RG.logLead(l,"whatsapp").then(function(){touch(l);RG.panelRedraw()}).catch(function(){});
  });
  // Open the lead (Open button, name or picture): everything about it in one panel.
  $("tb").addEventListener("click",function(e){
    var a=e.target.closest(".op,.lead .nm,.lead .av");if(a)RG.openLead(+a.closest(".lead").getAttribute("data-id"));
  });
  // CSV of what is currently on screen (so filters carry over to the download).
  $("csv").addEventListener("click",function(){
    var q=function(v){return '"'+String(v==null?"":v).replace(/"/g,'""')+'"'};
    var csv=[COLS.join(",")].concat(shown.map(function(l){return COLS.map(function(k){return q(l[k])}).join(",")})).join("\n");
    var a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["﻿"+csv],{type:"text/csv"}));a.download="restrogrow-v2-leads.csv";a.click();
  });
  RG.start(render);
})();
</script>
</body>
</html>
