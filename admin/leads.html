<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Leads - RestroGrow Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="admin.css">
</head>
<body>
<div id="login"><form id="lf">
  <h1>Admin login</h1><p>Enter the password to continue.</p>
  <input id="pw" type="password" placeholder="Password" autocomplete="current-password" required autofocus>
  <button class="btn" type="submit">Log in</button>
  <div id="err" role="alert"></div>
</form></div>

<div id="app">
  <nav class="nav">
    <span class="logo">Restro<b>Grow</b></span>
    <a class="tab" href="index.html">Dashboard</a>
    <a class="tab on" href="leads.html">Leads</a>
    <a class="tab" href="pages.html">Pages</a>
    <a class="tab" href="../text/">Notes</a>
    <span class="sp"></span>
    <button class="btn ghost" id="ref" type="button">Refresh</button>
    <button class="btn ghost" id="csv" type="button">Download CSV</button>
    <button class="btn ghost" id="out" type="button">Log out</button>
  </nav>

  <div class="top"><div><h1>Leads</h1><div class="sub" id="cnt"></div></div></div>

  <div id="waBar" class="x-warn" hidden></div>
  <div class="bar">
    <div class="chips" id="chips"></div>
    <input id="q" type="search" placeholder="Search name, phone, brand, city, notes">
  </div>
  <div class="leads" id="tb"></div>
</div>

<script src="common.js"></script>
<script>
(function(){
  var $=RG.$,esc=RG.esc,leads=[],filter="";
  var COLS=["time","name","phone","brand","location","outlets","orders","turnover","budget","status","notes","utm_source","utm_medium","utm_campaign","utm_content","utm_term","gclid","fbclid","page","ad_params","referrer","landing"];
  // Pulls the readable ad names out of the ad URL parameters (Meta: {{campaign.name}} {{adset.name}} {{ad.name}}; Google: ValueTrack).
  function adInfo(l){
    var p={};try{p=JSON.parse(l.ad_params||"{}")||{}}catch(x){}
    var pk=function(){for(var i=0;i<arguments.length;i++)if(p[arguments[i]])return p[arguments[i]];return ""};
    var parts=[["Campaign",pk("utm_campaign","campaign_name","campaign","campaignid","campaign_id")],["Ad set",pk("adset_name","adset","adgroup","adgroupid","adset_id","utm_content")],["Ad",pk("ad_name","ad","creative","ad_id")],["Placement",pk("placement","site_source_name","network")],["Keyword",pk("utm_term","keyword")]].filter(function(x){return x[1]});
    var all=Object.keys(p);
    return {parts:parts,all:all.length?all.map(function(k){return k+" = "+p[k]}).join("\n"):"",ref:l.referrer||""};
  }
  try{var p=new URLSearchParams(location.search).get("status");if(p&&RG.STATUSES.indexOf(p)>-1)filter=p}catch(x){}

  function chips(){
    var n=leads.length;
    $("chips").innerHTML=['<button type="button" class="chip'+(filter?"":" on")+'" data-f="">All<b>'+n+"</b></button>"].concat(RG.STATUSES.map(function(s){
      var m=leads.filter(function(l){return l.status===s}).length;
      return '<button type="button" class="chip'+(filter===s?" on":"")+'" data-f="'+esc(s)+'">'+esc(s)+"<b>"+m+"</b></button>";
    })).join("");
  }
  function list(){
    var q=$("q").value.trim().toLowerCase();
    var rows=leads.filter(function(l){
      return (!filter||l.status===filter)&&(!q||COLS.some(function(k){return String(l[k]||"").toLowerCase().indexOf(q)>-1}));
    });
    $("cnt").textContent="Showing "+rows.length+" of "+leads.length;
    $("tb").innerHTML=rows.length?rows.map(function(l){
      var opts=RG.STATUSES.map(function(x){return "<option"+(x===l.status?" selected":"")+">"+esc(x)+"</option>"}).join("");
      var wa="https://wa.me/91"+encodeURIComponent(l.phone)+"?text="+encodeURIComponent("Hi "+l.name+", this is RestroGrow. Thanks for requesting a demo.");
      var ic='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.6 10.8a15 15 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25 11.4 11.4 0 0 0 3.6.57 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.57a1 1 0 0 1-.25 1z"/></svg>';
      var tag=function(k,v){return v?'<span class="tag"><em>'+k+'</em>'+esc(v)+'</span>':""};
      var src=l.gclid?"Google":l.fbclid?"Meta":"";
      var srcTxt=[l.utm_source,l.utm_campaign].filter(Boolean).join(" / ");
      var lp=(String(l.page||"").match(/\/lp\/([a-z0-9-]+)/)||[])[1]||"";   /* which landing page the lead came from */
      var ai=adInfo(l);
      // One tidy "Source" panel under the header: network, landing page, ad names as label/value rows, WhatsApp result.
      var rows=ai.parts.map(function(x){return '<div class="sr"><span>'+x[0]+'</span><b>'+esc(x[1])+'</b></div>'}).join("");
      var all=(ai.all||ai.ref||l.landing)?'<details class="adx"><summary>All ad parameters</summary><pre>'+esc((ai.all?ai.all+"\n":"")+(ai.ref?"referrer = "+ai.ref+"\n":"")+(l.landing?"landing = "+l.landing:""))+'</pre></details>':"";
      var chipsS=(src?'<span class="tag src '+src.toLowerCase()+'">'+src+'</span>':'<span class="tag">Direct / other</span>')+(srcTxt&&!rows?'<span class="tag">'+esc(srcTxt)+'</span>':"")+(lp?'<span class="tag">Page: '+esc(lp)+'</span>':'<span class="tag">Page: main</span>');
      var waCls=l.wa_status==="sent"?"ok":l.wa_status?"bad":"";
      var wa_=l.wa_status?'<div class="wst '+waCls+'"><b>WhatsApp: '+esc(l.wa_status)+'</b>'+(l.wa_status==="sent"?"":'<span>'+esc(l.wa_note)+'</span>')+'</div>':"";
      var srcBox='<div class="srcbox"><div class="sch">'+chipsS+'</div>'+(rows?'<div class="srows">'+rows+'</div>':"")+wa_+all+'</div>';
      return '<article class="lead" data-id="'+l.id+'" data-s="'+esc(l.status)+'"><div class="hd"><div class="av">'+esc((l.name||"?").trim().charAt(0).toUpperCase())+'</div><div class="hi"><div class="nm">'+esc(l.name)+'</div><div class="mt">'+esc(l.brand)+' · '+esc(l.location)+'</div><div class="mt">'+esc(RG.fmt(l.time))+'</div></div></div>'+srcBox
        +'<div class="ph">'+esc(l.phone)+'</div>'
        +'<div class="tags">'+tag("Outlets",l.outlets)+tag("Orders/day",l.orders)+tag("Turnover",l.turnover)+tag("Budget",l.budget)+'</div>'
        +'<div class="acts"><a class="cl" href="tel:+91'+encodeURIComponent(l.phone)+'">'+ic+'Call</a><a class="wa" href="'+wa+'" target="_blank" rel="noopener">WhatsApp</a></div>'
        +'<select class="st" data-s="'+esc(l.status)+'" aria-label="Status">'+opts+'</select>'
        +'<textarea class="nt" maxlength="2000" placeholder="Add note" aria-label="Notes">'+esc(l.notes)+'</textarea>'+(l.wa_status!=="sent"?'<button type="button" class="rs">Resend WhatsApp message</button>':"")+'<button type="button" class="del">Delete this lead</button></article>';
    }).join(""):'<div class="empty card" style="grid-column:1/-1">No leads found.</div>';
  }
  // Banner: leads whose WhatsApp confirmation did not go out, with a one-click resend.
  function waBar(){
    var bad=leads.filter(function(l){return l.wa_status&&l.wa_status!=="sent"}).length,b=$("waBar");
    if(!bad){b.hidden=true;return}
    b.hidden=false;b.innerHTML='<span><b>'+bad+' lead'+(bad>1?'s':'')+'</b> did not get the WhatsApp message.</span><button type="button" class="btn" id="waAll">Resend to all</button>';
  }
  function resend(body,btn){
    if(btn){btn.disabled=true;btn.textContent="Sending..."}
    body.password=RG.pw;
    return fetch("../api/lead_resend.php",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)})
      .then(function(r){return r.json().then(function(j){if(!r.ok)throw new Error(j.error||"Error");return j})})
      .then(function(j){j.results.forEach(function(x){leads.forEach(function(l){if(l.id===x.id){l.wa_status=x.status;l.wa_note=x.note}})});chips();list();waBar();
        var f=j.results.filter(function(x){return x.status!=="sent"}).length;if(f)alert(f+" message(s) still failed. The reason is shown on the lead card.")})
      .catch(function(x){alert("Not sent: "+x.message);if(btn){btn.disabled=false;btn.textContent="Resend"}});
  }
  $("waBar").addEventListener("click",function(e){if(e.target.id==="waAll")resend({all:true},e.target)});
  function render(){leads=RG.leads;chips();list();waBar()}

  function save(card){
    var l=leads.filter(function(x){return String(x.id)===card.getAttribute("data-id")})[0];if(!l)return;
    var st=card.querySelector("select").value,nt=card.querySelector("textarea").value;
    if(st===l.status&&nt===l.notes)return;
    fetch("../api/lead_update.php",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({password:RG.pw,id:l.id,status:st,notes:nt})})
      .then(function(r){return r.json().then(function(j){if(!r.ok)throw new Error(j.error||"Error")})})
      .then(function(){var ch=l.status!==st;l.status=st;l.notes=nt;card.querySelector("select").setAttribute("data-s",st);card.setAttribute("data-s",st);chips();if(ch&&filter)list()})
      .catch(function(x){alert("Not saved: "+x.message)});
  }

  $("q").addEventListener("input",list);
  $("chips").addEventListener("click",function(e){var b=e.target.closest("[data-f]");if(!b)return;filter=b.getAttribute("data-f");chips();list()});
  $("tb").addEventListener("change",function(e){if(e.target.tagName==="SELECT")save(e.target.closest(".lead"))});
  $("tb").addEventListener("click",function(e){var b=e.target.closest(".rs");if(b)resend({id:+b.closest(".lead").getAttribute("data-id")},b)});
  // Permanently deletes a lead (use for test leads). Its phone number can then be submitted again.
  $("tb").addEventListener("click",function(e){
    var b=e.target.closest(".del");if(!b)return;
    var card=b.closest(".lead"),id=+card.getAttribute("data-id"),l=leads.filter(function(x){return x.id===id})[0];if(!l)return;
    if(!confirm("Delete "+l.name+" ("+l.phone+") permanently? This cannot be undone."))return;
    fetch("../api/lead_delete.php",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({password:RG.pw,id:id})})
      .then(function(r){return r.json().then(function(j){if(!r.ok)throw new Error(j.error||"Error")})})
      .then(function(){leads=leads.filter(function(x){return x.id!==id});RG.leads=leads;chips();list()})
      .catch(function(x){alert("Not deleted: "+x.message)});
  });
  $("tb").addEventListener("focusout",function(e){if(e.target.tagName==="TEXTAREA")save(e.target.closest(".lead"))});
  // Tapping Call marks the lead as Called (unless already Called / Converted / Not interested).
  $("tb").addEventListener("click",function(e){
    var a=e.target.closest(".cl");if(!a)return;
    var card=a.closest(".lead"),sel=card.querySelector("select");
    if(["New","Not answered","Follow-up"].indexOf(sel.value)>-1){sel.value="Called";save(card)}
  });
  $("csv").addEventListener("click",function(){
    var q=function(v){return '"'+String(v==null?"":v).replace(/"/g,'""')+'"'};
    var csv=[COLS.join(",")].concat(leads.map(function(l){return COLS.map(function(k){return q(l[k])}).join(",")})).join("\n");
    var a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["﻿"+csv],{type:"text/csv"}));a.download="restrogrow-leads.csv";a.click();
  });
  RG.start(render);
})();
</script>
</body>
</html>
